        <section class="allReels">
            <div class="reel">
                <img src="https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg" alt="">
                <div class="bottom">
                    <div class="user">
                        <img src="https://images.pexels.com/photos/2122276/pexels-photo-2122276.jpeg" alt="">
                        <h2>Instagram</h2>
                        <button>Follow</button>
                    </div>
                    <div class="title">
                        <h3>Lorem ipsum dolor sit amet</h3>
                    </div>
                </div>
            </div>
        </section>
        <section class="stats">

            </div>

                <h4><i class="ri-send-plane-line"></i></h4>
                <h5>300</h5>
            </div>
            <div class="menu">
                <h4><i class="ri-more-2-line"></i></h4>
            </div>
        </section>
    </section>
